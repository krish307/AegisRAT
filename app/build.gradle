plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aegis.rat'
    compileSdk 34

    defaultConfig {
        applicationId "com.aegis.rat"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    // CameraX for High-Performance Camera Access
    implementation "androidx.camera:camera-core:1.3.0"
    implementation "androidx.camera:camera-camera2:1.3.0"
    implementation "androidx.camera:camera-lifecycle:1.3.0"
    implementation "androidx.camera:camera-video:1.3.0"
}

// --- CARGO NDK INTEGRATION ---
// This task ensures the Rust library is built and placed in jniLibs before the APK is built.
task buildRustLib(type: Exec) {
    commandLine 'cargo', 'ndk', 'build', 
        '--target', 'aarch64-linux-android', 
        '--output-dir', "${projectDir}/src/main/jniLibs"
}

// Make sure the Android build waits for the Rust build
preBuild.dependsOn buildRustLib
